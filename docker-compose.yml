services:
  solar-sentinel:
    build: .
    image: solar-sentinel-aio:v3
    container_name: solar-sentinel
    ports:
      - "8123:8123"   # Home Assistant
      - "3000:3000"   # Grafana
      - "1883:1883"   # Mosquitto
      - "1880:1880"   # Node-RED
      - "3001:3001"   # Uptime Kuma
    volumes:
      - ./data:/data
    restart: unless-stopped
    mem_limit: 6g
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    environment:
      TZ: "${TZ:-Asia/Dubai}"
      # Weather (self-hosted open-meteo service below, or public API fallback)
      OPEN_METEO_URL: "${OPEN_METEO_URL:-http://open-meteo:8080}"
      # MQTT Configuration (override via .env - defaults are NOT secure)
      MQTT_BROKER: "localhost"
      MQTT_PORT: 1883
      MQTT_USER: "${MQTT_USER:-solar}"
      MQTT_PASS: "${MQTT_PASS:-solar123}"

      # InfluxDB Configuration (token is generated at first boot and stored in /data/influxdb/influx.env)
      INFLUXDB_URL: "http://localhost:8086"
      INFLUXDB_ORG: "${INFLUXDB_ORG:-my-org}"
      INFLUXDB_BUCKET_FORECAST: "solar_forecast"
      INFLUXDB_BUCKET_STATE: "system_state"
      INFLUXDB_BUCKET_EVA_NODES: "eva_nodes"
      INFLUXDB_BUCKET_EVA_PATTERNS: "eva_patterns"
      INFLUX_ADMIN_USER: "${INFLUX_ADMIN_USER:-solar}"
      INFLUX_ADMIN_PASSWORD: "${INFLUX_ADMIN_PASSWORD:-}"

      # Grafana admin password (override via .env)
      GF_SECURITY_ADMIN_PASSWORD: "${GF_SECURITY_ADMIN_PASSWORD:-SolarSentinel2024}"

      # Gemini API (Hermes AI Agent)
      GEMINI_API_KEY: "${GEMINI_API_KEY}"

      # EVA (Energy Value Architecture) Configuration
      EVA_PHANTOM_THRESHOLD_W: 5.0
      EVA_OPTIMAL_WINDOW_HOURS: 4
      EVA_LEARNING_INTERVAL_H: 6
      EVA_MAP_PUBLISH_INTERVAL_M: 1
      EVA_LOCKOUT_HYSTERESIS_MIN: 2

      # System Location
      LATITUDE: "25.2048"
      LONGITUDE: "55.2708"
      TIMEZONE: "Asia/Dubai"

      # Panel Configuration
      PANEL_EFFICIENCY: "0.215"
      PANEL_TEMP_COEFF: "-0.0026"
      PANEL_AREA: "20.0"

      # Thresholds (SOC percentages)
      SOC_LOCKOUT: "20.0"
      SOC_WARNING: "40.0"
      SOC_ADVISORY: "60.0"
      SOC_ABUNDANCE: "90.0"

      # Electricity rate used by Hermes waste analysis (USD/kWh)
      ELECTRICITY_RATE_USD_PER_KWH: "0.15"

      # Notifications
      NTFY_URL: "${NTFY_URL:-https://ntfy.sh/solar_sentinel_guard_alerts}"

  # Optional self-hosted weather service (Open-Meteo). Builds from upstream's
  # own Dockerfile on first run (slow, Swift toolchain). If you skip it or it
  # is unavailable, Energy Guard falls back to the public api.open-meteo.com.
  open-meteo:
    build:
      context: https://github.com/open-meteo/open-meteo.git#1.2.1
    image: solar-open-meteo:1.2.1
    command: ["serve", "--env", "production", "--hostname", "0.0.0.0", "--port", "8080"]
    volumes:
      - openmeteo_data:/app/data
    restart: unless-stopped

volumes:
  openmeteo_data:
