[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:homeassistant]
command=/usr/local/bin/ha-wrapper.sh
user=solar
autostart=true
autorestart=true
startsecs=30
depends_on=mosquitto
stdout_logfile=/var/log/supervisor/homeassistant.log
stderr_logfile=/var/log/supervisor/homeassistant.err.log

[program:influxdb]
command=influxd --config /etc/influxdb/config.yaml
user=solar
autostart=true
autorestart=true
startsecs=15
stdout_logfile=/var/log/supervisor/influxdb.log
stderr_logfile=/var/log/supervisor/influxdb.err.log

[program:influxdb-init]
command=/usr/local/bin/influx-init.sh
user=root
autostart=true
autorestart=false
startsecs=0
depends_on=influxdb
stdout_logfile=/var/log/supervisor/influxdb-init.log
stderr_logfile=/var/log/supervisor/influxdb-init.err.log

[program:grafana]
command=/usr/local/bin/grafana-wrapper.sh
user=solar
autostart=true
autorestart=true
startsecs=10
stdout_logfile=/var/log/supervisor/grafana.log
stderr_logfile=/var/log/supervisor/grafana.err.log

[program:mosquitto]
command=mosquitto -c /etc/mosquitto/mosquitto.conf
user=solar
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/var/log/supervisor/mosquitto.log
stderr_logfile=/var/log/supervisor/mosquitto.err.log

[program:node-red]
command=node-red -u /data/node-red --settings /etc/node-red/settings.js
user=solar
autostart=true
autorestart=true
startsecs=15
stdout_logfile=/var/log/supervisor/node-red.log
stderr_logfile=/var/log/supervisor/node-red.err.log

[program:uptime-kuma]
command=node /usr/share/uptime-kuma/server/server.js --data-dir /data/uptime-kuma
directory=/usr/share/uptime-kuma
user=solar
autostart=true
autorestart=true
startsecs=20
stdout_logfile=/var/log/supervisor/uptime-kuma.log
stderr_logfile=/var/log/supervisor/uptime-kuma.err.log
environment=PORT="3001"

[program:energy-guard]
command=/usr/local/bin/energy-guard
user=solar
autostart=true
autorestart=true
startsecs=10
depends_on=mosquitto,influxdb
stdout_logfile=/var/log/supervisor/energy-guard.log
stderr_logfile=/var/log/supervisor/energy-guard.err.log

[program:hermes-agent]
command=python3 /data/agent/hermes_agent.py
user=solar
autostart=true
autorestart=true
startsecs=30
depends_on=mosquitto
stdout_logfile=/var/log/supervisor/hermes.log
stderr_logfile=/var/log/supervisor/hermes.err.log

[program:cron]
command=crond -f -l 8
user=root
autostart=true
autorestart=true
startsecs=0
stdout_logfile=/var/log/supervisor/cron.log
stderr_logfile=/var/log/supervisor/cron.err.log

[program:healthcheck]
command=/data/scripts/healthcheck.sh
user=root
autostart=false
autorestart=false
startsecs=1
stdout_logfile=/data/logs/health.log
stderr_logfile=/data/logs/health.log
